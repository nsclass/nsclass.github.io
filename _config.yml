# Site settings
title: "Nam Seob Seo"
description: "Senior Software Engineer in Austin. Notes on C++, Rust, Java, and systems programming."
url: "https://nsclass.github.io"
baseurl: ""
lang: en-US

author:
  name: "Nam Seob Seo"

# Theme: Minima v3, pinned to a commit so upstream changes can't break the site.
# https://github.com/jekyll/minima
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c

minima:
  skin: classic # classic, dark, auto, solarized-light, solarized-dark, solarized
  date_format: "%b %-d, %Y"
  nav_pages:
    - posts/index.html
    - stats/index.html
    - search/index.html
    - about/index.html
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/nsclass"

# Reading files
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - staticman.yml
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: true
  auto_ids: true
  footnote_nr: 1
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter_opts:
    default_lang: javascript
    css_class: "syntax"
    block:
      line_numbers: true

sass:
  style: compressed
  quiet_deps: true

# Outputting
permalink: /:categories/:title/
paginate: 20
paginate_path: /page:num/

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
